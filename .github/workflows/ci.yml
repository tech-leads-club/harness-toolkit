name: CI

# Standard GitHub-hosted runners are free and unlimited on public repositories, so the whole matrix
# runs on every push. Larger runners would bill even here — keep the matrix on standard ones.
# why: no `push` trigger. On `main` this matrix runs as the first job of `release.yml`, which calls this file — so a
# push trigger here would run it a second time in parallel, which is the duplication that produced four live runs
# for one release ([/decisions/ad-087.md](/decisions/ad-087.md)).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# invariant: nothing at the workflow level, so a job that needs a scope has to name it. A job added later starts
# with no token rather than inheriting one ([/decisions/ad-097.md](/decisions/ad-097.md)).
permissions: {}

# why: a push to a pull request used to leave the previous run going — two runs of a three-platform matrix for
# one branch, and the older one answering about code nobody has any more. A run is superseded, not needed.
#
# hazard: `cancel-in-progress: ${{ github.event_name == 'pull_request' }}` is accepted without error and still
# cancels runs on `main`. The working shape is a group that is *shared* per pull request and *unique* per commit
# otherwise, so a main run can never collide with anything ([/decisions/ad-087.md](/decisions/ad-087.md)).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # why a job of its own and not a step of the gate: it reads a commit range, and the gate reads the working tree.
  # There is no base to compare against on `main`, which is also the moment it would be too late — an inert scope
  # that lied has already decided the version by then ([/decisions/ad-103.md](/decisions/ad-103.md)).
  #
  # why not on the matrix: the answer does not vary by platform, and asking it four times is three runners spent on
  # a question already answered.
  scopes:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # why full history: the check walks every commit of the pull request, and the base branch has to exist
          # locally for the range to resolve at all.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: An inert scope must not change what the package ships
        run: node tools/dev/check-scopes.ts --base "origin/${{ github.base_ref }}"

  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # why these three: the harness writes files and links them on whatever the operator runs. The Node line is
        # the one the package claims — `engines` is `>=24`, so 24 LTS is the floor and 26 Current is what a machine
        # updated today has. The second Node runs on one OS: a version difference that only shows on one platform
        # would be a Node bug, not ours.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
        include:
          - os: ubuntu-latest
            node: "26"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    # why: the gate runs in about three minutes. Without a ceiling a hung job holds a runner for the six-hour
    # default, which on a matrix of four is a day of nothing.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # why: `changelog in sync` reads which release each decision landed in out of the tag ranges, and a
          # one-commit checkout can see neither the commits that added them nor the tags.
          fetch-depth: 0
          # invariant: the gate reads and never pushes, so the credential does not stay in `.git/config`.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Bun (the bundler)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: npm ci

      # why: `dist/` is not committed, so this is where the bundler is proven on this platform. It is also what the
      # published tarball contains, built by `prepack` from the same script
      # ([/decisions/ad-097.md](/decisions/ad-097.md)).
      - name: Build the bundles
        run: node bin/tlc-build.mjs

      # invariant: one command, the same one a contributor runs. No `shell: bash` — there is nothing left in the
      # gate that needs a shell, which is what makes the Windows leg run the same code as the other two.
      - name: tlc harness test
        run: node bin/tlc.mjs harness test
        env:
          TLC_HOME: ${{ github.workspace }}
          # hazard: the suite writes provider config and skill links resolved from the environment. A scratch HOME
          # keeps a test that forgets to sandbox from reaching the runner's real one
          # ([/decisions/ad-095.md](/decisions/ad-095.md)).
          HOME: ${{ runner.temp }}
