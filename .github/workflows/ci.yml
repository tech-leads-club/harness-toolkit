name: CI

# Standard GitHub-hosted runners are free and unlimited on public repositories, so the whole matrix
# runs on every push. Larger runners would bill even here — keep the matrix on standard ones.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # why: `release.yml` calls this instead of repeating the gate. The publish job used to run
  # `tlc harness test` itself, on ubuntu only — so the thing that decided whether to publish was a
  # second, weaker copy of the thing that decides whether to merge ([/decisions/ad-084.md](/decisions/ad-084.md)).
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # why: `changelog in sync` reads which release each decision landed in out of the tag ranges, and a
          # one-commit checkout can see neither the commits that added them nor the tags.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Bun (build toolchain)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: npm ci
        shell: bash
        run: npm ci

      - name: Build dist/
        shell: bash
        run: bash bin/tlc-build
        env:
          TLC_HOME: ${{ github.workspace }}

      - name: tlc harness test
        shell: bash
        run: bash bin/tlc harness test
        env:
          TLC_HOME: ${{ github.workspace }}
          HOME: ${{ runner.temp }}

      # Linux only: the bundles embed their own source paths, so a rebuild on another OS differs by
      # separator and line ending. One platform is enough to catch a stale commit.
      - name: dist/ matches src/
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: node tools/dev/check-dist-fresh.ts
        env:
          TLC_HOME: ${{ github.workspace }}
