name: CI

# Standard GitHub-hosted runners are free and unlimited on public repositories, so the whole matrix
# runs on every push. Larger runners would bill even here — keep the matrix on standard ones.
# why: no `push` trigger. On `main` this matrix runs as the first job of `release.yml`, which calls this file — so a
# push trigger here would run it a second time in parallel, which is the duplication that produced four live runs
# for one release ([/decisions/ad-091.md](/decisions/ad-091.md)).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# why: a push to a pull request used to leave the previous run going — two runs of a three-platform matrix for
# one branch, and the older one answering about code nobody has any more. A run is superseded, not needed.
#
# hazard: `cancel-in-progress: ${{ github.event_name == 'pull_request' }}` is accepted without error and still
# cancels runs on `main`. The working shape is a group that is *shared* per pull request and *unique* per commit
# otherwise, so a main run can never collide with anything ([/decisions/ad-089.md](/decisions/ad-089.md)).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # why: the gate runs in about three minutes. Without a ceiling a hung job holds a runner for the six-hour
    # default, which on a matrix of three is eighteen hours of nothing.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # why: `changelog in sync` reads which release each decision landed in out of the tag ranges, and a
          # one-commit checkout can see neither the commits that added them nor the tags.
          fetch-depth: 0
          # invariant: the gate reads and never pushes, so the credential does not stay in `.git/config`.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Bun (build toolchain)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: npm ci
        shell: bash
        run: npm ci

      - name: Build dist/
        shell: bash
        run: bash bin/tlc-build
        env:
          TLC_HOME: ${{ github.workspace }}

      - name: tlc harness test
        shell: bash
        run: bash bin/tlc harness test
        env:
          TLC_HOME: ${{ github.workspace }}
          HOME: ${{ runner.temp }}

      # Linux only: the bundles embed their own source paths, so a rebuild on another OS differs by
      # separator and line ending. One platform is enough to catch a stale commit.
      - name: dist/ matches src/
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: node tools/dev/check-dist-fresh.ts
        env:
          TLC_HOME: ${{ github.workspace }}
