# Move a dist-tag to a version that is already published.
#
# why this exists: `latest` is the only tag npm treats specially — a bare `npm i` resolves it — so it is the one
# switch that decides what a new machine gets. Releasing straight onto it leaves no window between "published" and
# "everybody gets it": 0.4.2 shipped a defect that 0.4.3 fixed minutes later, and nothing was wrong with the gate
# ([/decisions/ad-102.md](/decisions/ad-102.md)).
#
# why a tag move and not another release: the artefact is already on the registry and already verified. Re-publishing
# to fix a bad `latest` needs a whole cycle; moving the tag is seconds, and it is the same lever for going forward
# and for going back.
#
# invariant: nothing here can publish. It moves a tag to a version that must already exist, and it verifies the git
# tag and the GitHub release exist for it first — promoting from a broken or half-finished release is the failure
# this guard is for.
#
# hazard: a tag move only reaches *new* installs. Anyone with the command already installed is unaffected until they
# update, so a bad `latest` still needs a patch behind it. The summary says so on every run rather than leaving it to
# be rediscovered.
name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "A version already published to npm, e.g. 0.4.3"
        required: true
        type: string
      channel:
        description: "The dist-tag to point at it"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      apply:
        description: "Unchecked is a dry run: it reports what it would do and changes nothing"
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    # why the same environment as the release: moving `latest` decides what every new install gets, which is the
    # same authority as publishing and belongs behind the same approval.
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm that speaks OIDC
        run: npm install -g npm@12.0.2

      # invariant: every claim is checked before anything moves. A version that npm does not have, a git tag that
      # does not exist, or a missing GitHub release each mean the previous release did not finish — and promoting
      # from that state is how a half-published version becomes the one everybody installs.
      # invariant: the three claims are checked by a script rather than by inline shell, because inline shell can
      # only be asserted by substring and a substring assertion cannot see logic being neutered — a probe that
      # wrapped one check in `false &&` left the test green ([/decisions/ad-102.md](/decisions/ad-102.md)).
      - name: Check the version is real and its release finished
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/dev/verify-promotable.mjs "$VERSION"

      - name: What this would do
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          echo "### Promote" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${CHANNEL}\` → \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Currently:" >> "$GITHUB_STEP_SUMMARY"
          npm dist-tag ls "$PKG" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A tag move reaches **new installs only** — anyone who already has the command keeps it until they" \
            "run \`tlc harness update\`. A bad \`latest\` still needs a patch behind it." >> "$GITHUB_STEP_SUMMARY"

      - name: Move the tag
        if: ${{ inputs.apply }}
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          npm dist-tag add "${PKG}@${VERSION}" "$CHANNEL"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Now:" >> "$GITHUB_STEP_SUMMARY"
          npm dist-tag ls "$PKG" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run — nothing was changed
        if: ${{ !inputs.apply }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Dry run.** Re-run with *apply* checked to move the tag." >> "$GITHUB_STEP_SUMMARY"
