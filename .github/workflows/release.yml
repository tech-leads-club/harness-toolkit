name: Release

# The version is computed from Conventional Commits since the last tag, and the release is written straight to
# `main` — no pull request. `tools/dev/next-version.ts` does the arithmetic against
# `src/core/release/release.version.ts`, which is pure, tested, and reproduces every version this repository has
# actually released ([/decisions/ad-087.md](/decisions/ad-087.md)).
#
# ORDER, and why it is this order:
#
#   gate → decide → [approval] → assert → bump + changelog + dist (local) → verify the artefact →
#   npm publish (OIDC, no token) → push commit+tag → release
#
# `decide` reads and writes nothing, so the approval is requested only when there is a version to publish. The
# approval is the `publish` environment on the one job that writes — structural, not a condition: GitHub does not
# start that job until a reviewer approves, so there is no `if:` to get wrong. The publish comes BEFORE anything
# reaches the remote: `v0.2.0`, `v0.2.2` and `v0.2.3` are all tagged and released on GitHub while npm sits on
# `0.2.1`, because the old shape tagged first and published later behind an approval that never came. And the push
# is LAST because it is the only reversible step — npm is immutable after 72 hours, a branch and a tag are not, so
# the irreversible step goes before the recoverable one.
#
# hazard: nothing here reads `package.json` to decide the next version. The base is the last *tag*. A manifest
# claiming a version no tag corresponds to is exactly what made the previous tool reprocess history and bump six
# times in nine minutes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# invariant: nothing at the workflow level. Every job names the scopes it needs, so a job added later starts
# with no token ([/decisions/ad-097.md](/decisions/ad-097.md)).
permissions: {}

# invariant: one release at a time, and NEVER cancelled halfway. `cancel-in-progress: true` here would mean a run
# arriving during the seconds between `npm publish` and the tag push destroys the only process that can finish the
# job — leaving an immutable version on the registry with no tag, which is the one state that needs a human. The
# published guidance says the same: cancel superseded work on pull requests, serialise deployments.
#
# why: waiting runs are still collapsed, but by the release itself rather than by this setting. Several pushes with
# nothing released yet leave several runs pending approval; approving one has it cancel the others before it
# publishes, so their commits land in the single version it computes rather than in one version each. The run doing
# the publishing is therefore never the run being cancelled ([/decisions/ad-095.md](/decisions/ad-095.md)).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # why: the gate that decides whether to release is the gate that runs on every pull request, called rather than
  # copied. One definition, one matrix, three platforms.
  gate:
    uses: ./.github/workflows/ci.yml
    # hazard: a called workflow cannot hold more than the job that calls it. With `permissions: {}` at the workflow
    # level and nothing here, the callee's `contents: read` exceeded the caller's empty token and the whole run
    # failed validation before any job started — `startup_failure`, with no job and no log to read
    # ([/decisions/ad-097.md](/decisions/ad-097.md)).
    permissions:
      contents: read

  # why: deciding BEFORE asking. The approval used to be the first job, which meant every push to `main` requested
  # one — including the ones that release nothing, which is most of them. Reading the plan first costs a checkout
  # and makes the approval mean something: it is only requested when there is a version to publish.
  #
  # why no `needs: gate`: this job reads git history and writes nothing, so waiting for a four-leg matrix to learn
  # that a `docs` commit releases nothing spends four minutes on an answer that takes twenty seconds. `release`
  # still needs both, so nothing is published behind a red gate
  # ([/decisions/ad-097.md](/decisions/ad-097.md)).
  decide:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.plan.outputs.released }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      current: ${{ steps.plan.outputs.current }}
    steps:
      # why: full history and tags. The base version is the last tag and the bump comes from the range since it, so
      # a shallow clone would read every commit as unreleased.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: What this release would be
        id: plan
        run: node tools/dev/next-version.ts >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.plan.outputs.released != 'true'
        run: |
          echo "no releasable commit since ${{ steps.plan.outputs.tag }} — staying on ${{ steps.plan.outputs.current }}"
          echo "### Nothing to release" >> "$GITHUB_STEP_SUMMARY"
          echo "Staying on ${{ steps.plan.outputs.current }}. Only \`feat\`, \`fix\` and \`perf\` outside the inert scopes release." >> "$GITHUB_STEP_SUMMARY"

  # why: the approval lives HERE, on the job that writes, and there is no separate gate job. A previous shape put
  # `environment: publish` on an approval job carrying `if: github.actor != '…bot'` — so on the bot's own push that
  # job was skipped, and the release job's `always()` condition let the publish through with no required reviewer at
  # all. The barrier has to be structural: GitHub does not start a job whose environment is unapproved, so there is
  # no condition left to get wrong ([/decisions/ad-087.md](/decisions/ad-087.md)).
  #
  # invariant: this is the only job that writes anywhere — npm, the branch, the tag, the release. Everything before
  # it reads.
  release:
    needs: [gate, decide]
    if: needs.decide.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: publish
    permissions:
      contents: write
      # why: cancelling the runs this one supersedes. Granted to GITHUB_TOKEN rather than added to the App's scope,
      # because the App token is the one that writes to `main` and it should not also be able to stop workflows.
      actions: write
      # Trusted publishing: npm exchanges this OIDC token for a short-lived credential, so no npm token is stored
      # anywhere. It is also what produces the provenance attestation, and only from a public repository.
      id-token: write
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      # why: the org disables write permissions for GITHUB_TOKEN across every repository, and the branch ruleset on
      # `main` requires an approving review. A GitHub App token is a separate credential that neither reaches, and
      # this App is a bypass actor on that ruleset — which is what makes a direct push to `main` legal for the bot
      # and for nobody else.
      #
      # hazard: `RELEASE_APP_ID` holds the App's **Client ID** (`Iv23…`), not the numeric App ID, and the input is
      # `client-id` for that reason.
      #
      # invariant: scoped to this repository and to the one verb this release needs. `contents: write` covers the
      # push, the tag and the GitHub Release — there is no pull request in this pipeline, so `pull-requests` is not
      # granted. An earlier attempt at this scope broke release creation, but that was release-please's own API call
      # and release-please is gone ([/decisions/ad-087.md](/decisions/ad-087.md)).
      - name: Generate a release-bot token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # why: full history and tags. The base version is the last tag, and the commit range since it is what earns
      # the bump — a shallow clone would read every commit as unreleased.
      #
      # why the credential stays in `.git/config` here, alone in this repository: this is the one job that pushes,
      # and it pushes the commit and the tag with `git push --atomic` at the end. Every other checkout in these
      # workflows sets `persist-credentials: false`, and the audit is suppressed on this line rather than
      # repository-wide so a new checkout that forgets it is still reported
      # ([/decisions/ad-097.md](/decisions/ad-097.md)).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # invariant: an exact version, not `latest`. This job holds `id-token: write` — the npm publishing identity —
      # so a mutable third-party payload here is the highest-value target in the repository, and it is the same
      # shape this product's own supply-chain rail refuses in a user's manifest
      # ([/decisions/ad-075.md](/decisions/ad-075.md)).
      - name: Install Bun (build toolchain)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: npm ci
        run: npm ci

      # why: this run was approved, so it is the one that publishes — and its plan already covers every commit since
      # the last tag, including the ones that made the other runs. Cancelling them here collapses several pushes into
      # one version instead of one version each, and does it from the run that is going to succeed rather than by
      # cancelling whichever run happened to be publishing ([/decisions/ad-095.md](/decisions/ad-095.md)).
      #
      # invariant: only runs older than this one, and only while they are still queued or waiting for approval. A run
      # that is already `in_progress` has passed its own approval and may be mid-publish; cancelling that is the
      # thing this whole ordering exists to prevent.
      - name: Collapse the runs this one supersedes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          superseded="$(gh api "repos/${REPO}/actions/workflows/release.yml/runs?status=waiting&per_page=50" \
            --jq ".workflow_runs[] | select(.id < ${RUN_ID}) | .id" 2>/dev/null || true)"
          queued="$(gh api "repos/${REPO}/actions/workflows/release.yml/runs?status=queued&per_page=50" \
            --jq ".workflow_runs[] | select(.id < ${RUN_ID}) | .id" 2>/dev/null || true)"
          count=0
          for id in $superseded $queued; do
            # why: a failure to cancel is reported and never fatal. Publishing the right version matters more than
            # tidying the queue, and a stale pending run costs nothing but a line in the list.
            if gh api -X POST "repos/${REPO}/actions/runs/${id}/cancel" >/dev/null 2>&1; then
              echo "cancelled superseded run ${id}"
              count=$((count + 1))
            else
              echo "::warning::could not cancel run ${id} — it stays pending and releases nothing on its own"
            fi
          done
          echo "${count} superseded run(s) cancelled; this run releases ${{ needs.decide.outputs.version }}"

      # invariant: the version about to be published must not already exist — not as a tag, not on the registry.
      # The base is the last tag, so a collision means the plan was computed against a state that has since moved,
      # and publishing over it is the one mistake that cannot be undone. Two reads, before anything is written.
      - name: The version must not already exist
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists. The plan was computed against a stale state; nothing was published."
            exit 1
          fi
          name="$(node -p "require('./package.json').name")"
          if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::${name}@${VERSION} is already on the registry. Nothing was published."
            exit 1
          fi
          echo "${TAG} is free and ${name}@${VERSION} is not on the registry"

      # invariant: every step below is skipped when nothing releasable landed. `docs`, `chore`, `ci` and the inert
      # scopes (`fix(ci)`, `fix(gate)`, `fix(release)`) release nothing — three versions were published for exactly
      # that kind of work before this rule existed.
      - name: Bump the version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        # why: `npm version --no-git-tag-version` updates package.json and package-lock.json together. Writing the
        # version by hand leaves the lockfile behind and `npm ci` then fails on a mismatch nobody caused.
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # why: CHANGELOG.md is generated from docs/decisions/, and `--release` names the version the pending section
      # becomes ([/decisions/ad-055.md](/decisions/ad-055.md)).
      - name: Render the changelog at this version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: node tools/dev/render-changelog.ts --release "v${VERSION}"

      # invariant: the published bundles are built here, from this commit. `dist/` is no longer committed, so there
      # is nothing to trust and nothing to drift — `prepack` runs the same script again at pack time
      # ([/decisions/ad-097.md](/decisions/ad-097.md)).
      - name: Build the bundles
        run: node bin/tlc-build.mjs
        env:
          TLC_HOME: ${{ github.workspace }}

      # invariant: the last thing before the irreversible step, and it validates the *artefact* rather than the tree.
      # Three install defects reached operators through that gap — 0.3.0 installed nothing, 0.3.2 shipped bundles
      # where every entry answered as the CLI, and 0.4.0 left `tlc` off `PATH`. Each was found by a person on their
      # own machine, after publish ([/decisions/ad-102.md](/decisions/ad-102.md)).
      #
      # why here and not in the gate: it resolves dependencies from the network and installs globally in a container,
      # which does not belong in the loop a contributor runs on every change.
      - name: Verify the packed artefact in a clean room
        run: node tools/dev/verify-package.mjs

      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm bundled with Node 24.
      #
      # invariant: an exact version, for the same reason Bun is pinned above — `npm@latest` in the job that mints
      # the publish credential is a mutable payload in the highest-value slot. It also removes a scheduled
      # breakage: npm 12 defaults `allow-remote` to none, and `latest` walks into that on its own schedule.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@12.0.2

      # THE IRREVERSIBLE STEP, and it is tokenless. Trusted publishing mints a short-lived OIDC credential per run
      # and npm checks it against the registered publisher — organisation, repository, workflow filename and
      # environment name — so there is no stored secret to steal and nothing to rotate. Provenance is generated from
      # it automatically ([/decisions/ad-102.md](/decisions/ad-102.md)).
      #
      # why straight to `latest` and not through a channel: the two shapes tried before this were a `next` dist-tag
      # and `npm stage publish`. The first needs an automation token, because trusted publishing does not cover
      # `npm dist-tag`. The second is tokenless but deliberately cannot be finished by a workflow — every stage
      # subcommand except `publish` requires proof of presence — so it converts every release into a manual step.
      # Neither buys safety that the gate does not already provide.
      #
      # what makes this safe instead: eighteen gate steps on four platforms, the packed artefact installed and driven
      # in a clean room immediately above, and provenance on the result. A registry has no rollback — versions are
      # immutable and a tag move needs a token — so the recovery for a bad version is the next patch, which this same
      # pipeline ships in minutes.
      - name: Publish to npm
        run: npm publish

      # why: after the publish, and atomically. `--atomic` means the branch and the tag land together or neither
      # does; a tag without its commit points at a tree whose package.json says the previous version.
      #
      # hazard: this is the one window that needs a human. If the publish succeeded and this push fails, npm has the
      # version and `main` does not. The recovery is to re-run this job: `npm publish` will refuse the existing
      # version, so re-running is not idempotent — the operator pushes the commit and tag by hand instead. That is
      # written in the failure message rather than left to be rediscovered.
      - name: Push the commit and the tag
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          TAG: ${{ needs.decide.outputs.tag }}
          AUTHOR: ${{ steps.app-token.outputs.app-slug || 'github-actions' }}
        run: |
          git config user.name "${AUTHOR}[bot]"
          git config user.email "${AUTHOR}[bot]@users.noreply.github.com"
          # hazard: this named `dist` while it was tracked. Untracking it made `git add` exit 1 under `bash -e`,
          # AFTER the publish — npm held 0.3.0 and main held 0.2.4, which is the one state this whole ordering
          # exists to avoid. The list is now exactly what the version bump and the changelog touch, and every one
          # of them is tracked ([/decisions/ad-097.md](/decisions/ad-097.md)).
          git add package.json package-lock.json CHANGELOG.md
          # why: `chore(release):` is an inert type, so this commit cannot earn the next version. That is what makes
          # the pipeline terminate instead of releasing itself for ever.
          git commit -m "chore(release): ${VERSION}"
          git tag -a "$TAG" -m "$TAG"
          if ! git push --atomic origin HEAD:main "refs/tags/$TAG"; then
            echo "::error::npm has ${VERSION} and main does not. The publish cannot be repeated — push the commit" \
              "and tag by hand: git push --atomic origin HEAD:main refs/tags/${TAG}"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          VERSION: ${{ needs.decide.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" \
            --title "v${VERSION}" \
            --notes "See [CHANGELOG.md](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.md)."

